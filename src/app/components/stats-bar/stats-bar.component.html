<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
  @for (stat of stats; track stat.label) {
    <div class="relative p-5 sm:p-6 rounded-2xl bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl border border-slate-200/80 dark:border-white/10 hover:border-cyan-500/40 dark:hover:border-cyan-400/40 shadow-sm hover:shadow-md transition-all duration-300 group hover:-translate-y-1">
      
      <!-- Subtle top gradient accent -->
      <div class="absolute top-0 inset-x-6 h-0.5 bg-gradient-to-r from-cyan-500 to-indigo-500 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <div class="flex items-center justify-between mb-3">
        <span class="text-3xl sm:text-4xl font-extrabold font-mono tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-indigo-600 dark:from-cyan-400 dark:to-indigo-400">
          {{ stat.value }}
        </span>
        <div class="w-10 h-10 rounded-xl bg-cyan-500/10 dark:bg-cyan-500/15 border border-cyan-500/20 flex items-center justify-center text-cyan-600 dark:text-cyan-400 group-hover:scale-110 transition-transform duration-300">
          <app-icon [name]="stat.icon" [size]="20" />
        </div>
      </div>

      <p class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 leading-snug">
        {{ stat.label }}
      </p>
    </div>
  }
</div>
