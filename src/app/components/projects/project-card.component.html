<div class="h-full flex flex-col rounded-2xl overflow-hidden bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl border border-slate-200/80 dark:border-white/10 hover:border-cyan-500/40 transition-all duration-300 shadow-sm hover:shadow-xl group hover:-translate-y-1">
  
  <!-- Thumbnail Container (Clickable to Live Demo / Repo) -->
  <div class="relative aspect-video w-full overflow-hidden bg-slate-950">
    <a
      [href]="project().liveUrl || project().githubUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="block w-full h-full cursor-pointer focus:outline-none"
      [title]="(project().liveUrl ? 'Open live demo for ' : 'View GitHub repository for ') + project().title"
    >
      <img
        [src]="project().thumbnail"
        [alt]="project().title"
        class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500 filter saturate-105"
        loading="lazy"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
    </a>

    <!-- Category Pill -->
    <div class="absolute top-3 left-3 pointer-events-none">
      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-mono font-semibold uppercase tracking-wider bg-slate-950/80 backdrop-blur-md text-cyan-400 border border-cyan-500/30">
        {{ project().category }}
      </span>
    </div>

    <!-- Quick View Overlay Button on Hover -->
    <button
      type="button"
      (click)="openModal()"
      class="absolute bottom-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity duration-200 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900/90 text-cyan-300 backdrop-blur-md border border-cyan-500/40 hover:bg-slate-800 flex items-center space-x-1.5 cursor-pointer shadow-lg z-10"
      title="Quick architectural overview"
    >
      <app-icon name="layers" [size]="14" />
      <span>Quick View</span>
    </button>
  </div>

  <!-- Content -->
  <div class="p-5 sm:p-6 flex-1 flex flex-col justify-between">
    <div>
      <h3 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-2">
        <a
          [href]="project().liveUrl || project().githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors inline-flex items-center space-x-1 cursor-pointer"
          [title]="(project().liveUrl ? 'Open ' : 'View code for ') + project().title"
        >
          <span>{{ project().title }}</span>
          <app-icon name="external-link" [size]="14" className="opacity-0 group-hover:opacity-80 transition-opacity" />
        </a>
      </h3>

      <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 line-clamp-3 leading-relaxed mb-4">
        {{ project().description }}
      </p>

      <!-- Tech Stack Badges -->
      <div class="flex flex-wrap gap-1.5 mb-5">
        @for (tech of project().techStack; track tech) {
          <span class="px-2 py-0.5 rounded-md text-[11px] font-mono font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300">
            {{ tech }}
          </span>
        }
      </div>
    </div>

    <!-- Action Links -->
    <div class="pt-4 border-t border-slate-200/60 dark:border-white/5 flex items-center justify-between">
      <button
        type="button"
        (click)="openModal()"
        class="text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 flex items-center space-x-1 transition-colors cursor-pointer"
        title="View architecture details"
      >
        <span>Architecture</span>
        <app-icon name="arrow-right" [size]="12" />
      </button>

      <div class="flex items-center space-x-2">
        @if (project().liveUrl) {
          <a
            [href]="project().liveUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="p-2 rounded-lg bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 hover:bg-cyan-500/20 transition-colors cursor-pointer"
            title="Live Preview"
            aria-label="Live Preview"
          >
            <app-icon name="external-link" [size]="16" />
          </a>
        }

        <a
          [href]="project().githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-cyan-500 transition-colors cursor-pointer"
          title="GitHub Repository"
          aria-label="GitHub Repository"
        >
          <app-icon name="github" [size]="16" />
        </a>
      </div>
    </div>

  </div>
</div>
